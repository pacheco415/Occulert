name: Compare native dependency reports
on:
  push:
    branches: [codex/expo-patch-lock-resolution]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      matrix:
        revision: [4a6d16ddbd287295cd8cb63deefb6f9605e031d6, c503f545d84e07f8a22ac1d28dee2bfc8844209d]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.revision }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - name: Summarize current registry advisories
        working-directory: native-app
        run: |
          npm audit --json > "$RUNNER_TEMP/audit.json" || test "$?" = 1
          node - "$RUNNER_TEMP/audit.json" <<'NODE'
          const report = require(process.argv[2]);
          console.log(report.metadata.vulnerabilities);
          for (const entry of Object.values(report.vulnerabilities)) {
            for (const a of entry.via) if (typeof a === 'object') {
              console.log(JSON.stringify({name:a.name, title:a.title, advisory:a.url, affected:a.range, fix:entry.fixAvailable, installed:entry.nodes.map(k=>[k,require('./package-lock.json').packages[k]?.version])}));
            }
          }
          NODE
