name: Native App Typecheck

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native-app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: native-app/package-lock.json
      - run: npm ci --include=dev
      - run: npm run verify

      - name: Save source and environment verification evidence
        if: ${{ !cancelled() }}
        run: node ../scripts/write-verification-receipt.mjs native '${{ job.status }}'
      - name: Preserve verification receipt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-native-${{ github.sha }}
          path: .verification-receipts/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  eas-install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native-app
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: native-app/package-lock.json
      - name: Match EAS package manager
        run: npm install --global npm@10.9.8
      - run: npm ci --include=dev
      - run: npm run verify

      - name: Save source and environment verification evidence
        if: ${{ !cancelled() }}
        run: node ../scripts/write-verification-receipt.mjs eas-install '${{ job.status }}'
      - name: Preserve verification receipt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-eas-install-${{ github.sha }}
          path: .verification-receipts/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  watch-notification:
    name: Watch notification freshness
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/test-watch-notification.mjs

      - name: Save source and environment verification evidence
        if: ${{ !cancelled() }}
        run: node scripts/write-verification-receipt.mjs watch-notification '${{ job.status }}'
      - name: Preserve verification receipt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-watch-notification-${{ github.sha }}
          path: .verification-receipts/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
