name: Prepare Expo dependency update
on:
  pull_request:
    paths:
      - '.github/workflows/prepare-expo-lock.yml'
permissions:
  contents: read
jobs:
  prepare:
    if: github.head_ref == 'codex/expo-patch-nov27'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native-app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - run: npm install --global npm@10.9.8
      - run: npm ci --include=dev
      - run: npx --no-install expo install --fix
      - run: npm ci --include=dev && npm run verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verified-expo-manifests
          path: |
            native-app/package.json
            native-app/package-lock.json
          if-no-files-found: error
          retention-days: 3
