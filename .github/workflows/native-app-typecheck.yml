name: Native App Typecheck

on:
  pull_request:
    paths:
      - "native-app/**"
  push:
    branches: [main]
    paths:
      - "native-app/**"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: native-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
