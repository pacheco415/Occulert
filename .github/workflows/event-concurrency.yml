name: Event PostgreSQL Concurrency

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  concurrency:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install locked isolated test client
        run: npm ci --ignore-scripts --prefix scripts/event-concurrency-runtime
      - name: Build checksum-pinned official PostgreSQL
        run: bash scripts/build-concurrency-postgres.sh
      - name: Exercise independent local PostgreSQL connections
        run: |
          OCCULERT_PG_TEST_RUNTIME="$GITHUB_WORKSPACE/scripts/event-concurrency-runtime" \
          OCCULERT_PG_RECEIPT_DIR="$GITHUB_WORKSPACE/.verification-receipts" \
          node scripts/test-event-idempotency-concurrency.mjs
      - name: Preserve successful concurrency receipt
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-event-concurrency-${{ github.sha }}
          path: .verification-receipts/event-concurrency.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
