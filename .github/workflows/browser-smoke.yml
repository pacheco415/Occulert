name: Browser Smoke Tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Check native form controls on Linux WebKit
        run: npm run test:browser -- tests/onboarding-form-validation.spec.mjs --project=webkit
      - run: npm run test:browser
      - name: Preserve browser failure and retry diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
