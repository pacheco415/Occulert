name: Weekly Asset Retirement Check

on:
  schedule:
    # Monday 09:17 PDT / 08:17 PST. GitHub schedules use UTC.
    - cron: '17 16 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  retirement:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: List eligible assets and check approaching audit deadlines
        # Cover deadlines through the next weekly run, including weekends.
        run: npm run asset:retire -- --check --fail-within-days=7
