<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Occulert Login</title><meta name="theme-color" content="#0a0e1a"><style>body{margin:0;background:#0a0e1a;color:#e2e8f0;font-family:Inter,Arial,sans-serif;display:grid;place-items:center;min-height:100vh}.card{width:min(440px,92vw);background:#111827;border:1px solid #24324a;border-radius:22px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.35)}h1{margin:0 0 8px;color:#fff}.muted{color:#94a3b8;line-height:1.6}.field{display:grid;gap:7px;margin:16px 0}.field label{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#94a3b8}.field input{background:#0f172a;border:1px solid #344d72;border-radius:12px;padding:13px;color:#fff}.btn{width:100%;border:1px solid #2563eb;background:#2563eb;color:#fff;border-radius:12px;padding:14px;font-weight:900;cursor:pointer}.link{display:block;color:#60a5fa;text-decoration:none;margin-top:14px;text-align:center}.error{color:#fecaca;margin-top:12px;display:none}.ok{color:#10b981;margin-top:12px;display:none}.note{font-size:12px;color:#64748b;margin-top:18px}</style></head><body><main class="card"><h1>Occulert Access</h1><p class="muted">Prototype access gate for fleet demo pages. Next production step is Firebase Authentication.</p><div class="field"><label>Access code</label><input id="code" placeholder="Enter fleet access code" type="password"></div><button class="btn" onclick="login()">Enter Dashboard</button><div class="error" id="err">Wrong code. Try again.</div><div class="ok" id="ok">Access granted. Redirecting...</div><a class="link" href="/">Back to Home</a><p class="note">Demo code: OCCULERT-DEMO. This is not final enterprise security.</p></main><script>function login(){let c=document.getElementById('code').value.trim();if(c==='OCCULERT-DEMO'){localStorage.setItem('occulert-auth','demo-admin');document.getElementById('ok').style.display='block';setTimeout(()=>location.href='/fleet-dashboard.html',600)}else document.getElementById('err').style.display='block'}</script></body></html>
