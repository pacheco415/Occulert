name: Browser Smoke Tests

on:
  pull_request:
    paths:
      - "**.html"
      - "**.js"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.mjs"
      - "tests/**"
      - "vercel.json"
  push:
    branches: [main]
    paths:
      - "**.html"
      - "**.js"
      - "package.json"
      - "package-lock.json"
      - "playwright.config.mjs"
      - "tests/**"
      - "vercel.json"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
