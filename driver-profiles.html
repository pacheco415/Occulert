<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Occulert Driver Profiles</title><meta name="description" content="Manage Occulert prototype driver profiles for fleet safety monitoring."><meta name="theme-color" content="#0a0e1a"><style>*{box-sizing:border-box}body{margin:0;background:#0a0e1a;color:#e2e8f0;font-family:Inter,Arial,sans-serif}.top{height:68px;background:#111827;border-bottom:1px solid #24324a;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{font-weight:900;color:#fff}.nav{display:flex;gap:10px}.btn{border:1px solid #344d72;background:#1e2d45;color:#e2e8f0;border-radius:10px;padding:10px 14px;text-decoration:none;font-weight:800;font-size:13px;cursor:pointer}.btn.primary{background:#2563eb;border-color:#2563eb}.wrap{max-width:1050px;margin:0 auto;padding:28px}h1{margin:0 0 8px;color:#fff}.muted{color:#94a3b8}.layout{display:grid;grid-template-columns:360px 1fr;gap:18px;margin-top:24px}.card{background:#111827;border:1px solid #24324a;border-radius:18px;padding:18px}.field{display:grid;gap:6px;margin-bottom:12px}.field label{font-size:12px;color:#94a3b8;text-transform:uppercase;letter-spacing:1px}.field input,.field select{background:#0f172a;border:1px solid #344d72;border-radius:10px;padding:12px;color:#fff}.drivers{display:grid;gap:12px}.driver{display:grid;grid-template-columns:48px 1fr 120px;gap:12px;align-items:center;background:#0f172a;border:1px solid #24324a;border-radius:14px;padding:14px}.avatar{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#2563eb,#06b6d4);display:grid;place-items:center;color:#fff;font-weight:900}.pill{border-radius:999px;padding:6px 10px;font-size:12px;font-weight:900;text-align:center;border:1px solid;color:#10b981;background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.3)}.danger{color:#ef4444;background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3)}@media(max-width:850px){.layout{grid-template-columns:1fr}.nav{display:none}.driver{grid-template-columns:48px 1fr}}</style></head>
<body><div class="top"><div class="brand">Occulert Driver Profiles</div><div class="nav"><a class="btn" href="/">Home</a><a class="btn" href="/app.html">Launch App</a><a class="btn" href="/fleet-dashboard.html">Fleet Dashboard</a><a class="btn" href="/session-history.html">History</a></div></div><main class="wrap"><h1>Prototype driver profiles</h1><p class="muted">Create local driver profiles for demos. Future fleet accounts should store these in a secure backend.</p><section class="layout"><div class="card"><h2>Add driver</h2><div class="field"><label>Name</label><input id="name" placeholder="Driver name"></div><div class="field"><label>Vehicle / route</label><input id="route" placeholder="Vehicle 12 / Bay Area route"></div><div class="field"><label>Status</label><select id="status"><option>Active</option><option>Training</option><option>Inactive</option></select></div><button class="btn primary" onclick="addDriver()">Save Driver</button><button class="btn" style="margin-top:10px;width:100%" onclick="seedDrivers()">Load sample drivers</button></div><div class="card"><h2>Drivers</h2><div class="drivers" id="drivers"></div></div></section></main><script>
function get(){try{return JSON.parse(localStorage.getItem('occulert-drivers')||'[]')}catch(e){return[]}}
function set(v){localStorage.setItem('occulert-drivers',JSON.stringify(v))}
function initials(n){return(n||'D').split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase()}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function render(){let d=get();document.getElementById('drivers').innerHTML=d.length?d.map((x,i)=>`<div class="driver"><div class="avatar">${esc(initials(x.name))}</div><div><strong>${esc(x.name)}</strong><br><span class="muted">${esc(x.route||'No route set')}</span></div><div><span class="pill ${x.status==='Inactive'?'danger':''}">${esc(x.status)}</span><br><button class="btn" style="margin-top:8px;padding:6px 9px" onclick="removeDriver(${i})">Remove</button></div></div>`).join(''):'<p class="muted">No drivers yet.</p>'}
function addDriver(){let name=document.getElementById('name').value.trim();if(!name)return alert('Add a driver name');let route=document.getElementById('route').value.trim(),status=document.getElementById('status').value,d=get();d.unshift({id:'DRV-'+Date.now(),name,route,status,createdAt:new Date().toISOString()});set(d);document.getElementById('name').value='';document.getElementById('route').value='';render()}
function removeDriver(i){let d=get();d.splice(i,1);set(d);render()}
function seedDrivers(){set([{id:'DRV-1',name:'Marcus T.',route:'North Bay Delivery Route',status:'Active'},{id:'DRV-2',name:'Jordan M.',route:'Bay Bridge Eastbound',status:'Active'},{id:'DRV-3',name:'Alicia S.',route:'Oakland Delivery Loop',status:'Training'}]);render()}
render();
</script></body></html>
