<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accept Occulert Fleet Invitation</title>
  <meta name="description" content="Sign in with the invited email and securely join an Occulert fleet.">
  <meta name="theme-color" content="#0a0e1a">
  <link rel="canonical" href="https://www.occulert.com/accept-invite.html">
  <script>
    (function(){
      var token=new URLSearchParams(location.hash.slice(1)).get('token');
      if(token)sessionStorage.setItem('occulert-invite-token',token);
      if(location.hash)history.replaceState(null,'',location.pathname+location.search);
    })();
  </script>
  <script src="/occulert-backend.js"></script>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#0a0e1a;color:#e2e8f0;font-family:Inter,Arial,sans-serif;line-height:1.55}.top{min-height:68px;background:#111827;border-bottom:1px solid #24324a;display:flex;align-items:center;justify-content:space-between;padding:14px 24px}.brand{font-weight:900;color:#fff}.btn{border:1px solid #344d72;background:#1e2d45;color:#e2e8f0;border-radius:10px;padding:11px 15px;text-decoration:none;font-weight:800;font-size:13px;cursor:pointer}.btn.primary{background:#2563eb;border-color:#2563eb}.btn.good{background:#10b981;border-color:#10b981;color:#03140f}.wrap{max-width:620px;margin:0 auto;padding:38px 18px}.card{background:#111827;border:1px solid #24324a;border-radius:20px;padding:24px;box-shadow:0 24px 70px rgba(0,0,0,.28)}h1{font-size:36px;line-height:1.12;margin:0 0 12px;color:#fff}.muted{color:#94a3b8}.form{display:grid;gap:13px;margin-top:20px}.field label{display:block;font-size:12px;color:#94a3b8;text-transform:uppercase;letter-spacing:1.2px;margin-bottom:6px}.field input{width:100%;background:#0f172a;border:1px solid #344d72;color:#e2e8f0;border-radius:10px;padding:12px 13px;font-size:15px}.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.notice{border:1px solid #344d72;border-radius:12px;background:rgba(37,99,235,.08);padding:14px;color:#b8c7da;margin-top:16px}.notice.good{border-color:rgba(16,185,129,.4);background:rgba(16,185,129,.1);color:#bbf7d0}.notice.bad{border-color:rgba(239,68,68,.4);background:rgba(239,68,68,.1);color:#fecaca}.hidden{display:none}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}@media(max-width:520px){.split{grid-template-columns:1fr}h1{font-size:30px}}
  </style>
</head>
<body>
  <header class="top"><div class="brand">Occulert Driver Invite</div><a class="btn" href="/">Home</a></header>
  <main class="wrap">
    <section class="card">
      <h1>Join your fleet</h1>
      <p class="muted">Use the exact email your manager invited. Occulert verifies the signed-in email before adding your driver profile.</p>
      <div class="notice" id="userState">Checking your invitation…</div>
      <form class="form" id="acceptForm" onsubmit="signInAndAccept(event,'signin')">
        <div class="field"><label for="name">Driver name</label><input id="name" required maxlength="160" autocomplete="name" placeholder="Your name"></div>
        <div class="field"><label for="vehicle">Vehicle or route</label><input id="vehicle" maxlength="120" placeholder="Van 12"></div>
        <div class="field" id="emailField"><label for="email">Invited email</label><input id="email" type="email" required maxlength="240" autocomplete="email" placeholder="driver@example.com"></div>
        <div class="field" id="passwordField"><label for="password">Password</label><input id="password" type="password" required minlength="6" autocomplete="current-password"></div>
        <div class="split" id="signedOutActions"><button class="btn primary" type="submit">Sign In and Accept</button><button class="btn good" type="button" onclick="signInAndAccept(event,'signup')">Create Account</button></div>
        <div class="split hidden" id="signedInActions"><button class="btn primary" type="button" onclick="acceptForCurrentUser()">Accept Invitation</button><button class="btn" type="button" onclick="useDifferentAccount()">Use Different Account</button></div>
      </form>
      <div class="notice hidden" id="result" role="status"></div>
      <div class="actions hidden" id="successActions"><a class="btn primary" href="/app.html">Open Driver App</a><a class="btn" href="/account.html">View Account</a></div>
    </section>
  </main>
<script>
function show(message,type){let el=document.getElementById('result');el.className='notice '+(type||'');el.textContent=message}
function messageFor(error){return({email_not_verified:'Confirm your email, then return to this page and sign in.',invitation_email_mismatch:'This invitation was sent to a different email address.',invitation_already_used:'This invitation has already been used.',invitation_revoked:'This invitation was revoked by the fleet manager.',invitation_expired:'This invitation expired. Ask the manager for a new link.',invalid_invitation:'This invitation link is invalid.',driver_already_assigned:'This driver account already belongs to another fleet.',driver_profile_required:'Your driver profile could not be created.',sign_in_required:'Sign in with the invited email first.'})[error]||'The invitation could not be accepted. Please try again.'}
function token(){return sessionStorage.getItem('occulert-invite-token')||''}
function renderUser(){let user=window.OcculertBackend.currentUser(),hasToken=!!token(),email=document.getElementById('email'),password=document.getElementById('password');if(!hasToken){document.getElementById('acceptForm').classList.add('hidden');document.getElementById('userState').className='notice bad';document.getElementById('userState').textContent='This invitation link is missing or invalid.';return}if(user){email.value=user.email||'';email.readOnly=true;password.required=false;document.getElementById('emailField').classList.add('hidden');document.getElementById('passwordField').classList.add('hidden');document.getElementById('signedOutActions').classList.add('hidden');document.getElementById('signedInActions').classList.remove('hidden');document.getElementById('userState').textContent='Signed in as '+(user.email||'your Occulert account')+'.';}else{email.readOnly=false;password.required=true;document.getElementById('emailField').classList.remove('hidden');document.getElementById('passwordField').classList.remove('hidden');document.getElementById('signedOutActions').classList.remove('hidden');document.getElementById('signedInActions').classList.add('hidden');document.getElementById('userState').textContent='Sign in or create a driver account with the invited email.'}}
async function finishAcceptance(){show('Verifying your invitation…');let profile=await window.OcculertBackend.ensureDriverProfile({name:document.getElementById('name').value.trim(),vehicle:document.getElementById('vehicle').value.trim()});if(!profile.ok){show(messageFor(profile.body&&profile.body.error),'bad');return}let result=await window.OcculertBackend.acceptFleetInvitation(token());if(!result.ok){show(messageFor(result.body&&result.body.error),'bad');return}sessionStorage.removeItem('occulert-invite-token');document.getElementById('acceptForm').classList.add('hidden');document.getElementById('successActions').classList.remove('hidden');show('You joined '+(result.body.fleet.company_name||'the fleet')+'. Your future opted-in sessions can now appear in its protected dashboard.','good')}
async function acceptForCurrentUser(){await finishAcceptance()}
function useDifferentAccount(){window.OcculertBackend.signOut();show('Signed out. Use the invited email to continue.');renderUser()}
async function signInAndAccept(event,mode){event.preventDefault();show(mode==='signup'?'Creating your account…':'Signing in…');let email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;let auth=mode==='signup'?await window.OcculertBackend.signUp(email,password):await window.OcculertBackend.signIn(email,password);if(!auth.ok){show(messageFor(auth.body&&auth.body.error),'bad');return}if(!window.OcculertBackend.currentUser()){show('Confirm your email, then return to this invitation and sign in.','bad');return}renderUser();await finishAcceptance()}
renderUser();
</script>
</body>
</html>
