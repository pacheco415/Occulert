name: Site Audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verify asset lineage against the actual PR head
        if: github.event_name == 'pull_request'
        env:
          ASSET_LINEAGE_HEAD: ${{ github.event.pull_request.head.sha }}
          ASSET_LINEAGE_BASE: ${{ github.event.pull_request.base.sha }}
        run: node scripts/audit-asset-lineage.mjs
      - name: Audit every site change
        run: npm run audit:site
      - run: npm run verify

      - name: Save source and environment verification evidence
        if: ${{ !cancelled() }}
        run: node scripts/write-verification-receipt.mjs site '${{ job.status }}'
      - name: Preserve verification receipt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-site-${{ github.sha }}
          path: .verification-receipts/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
