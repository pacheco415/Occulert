name: Dependency Audit Reports

on:
  pull_request:
    paths:
      - 'package*.json'
      - 'native-app/package*.json'
      - 'scripts/report-dependency-audits.mjs'
      - '.github/workflows/dependency-audit.yml'
  push:
    branches: [main]
    paths:
      - 'package*.json'
      - 'native-app/package*.json'
      - 'scripts/report-dependency-audits.mjs'
      - '.github/workflows/dependency-audit.yml'
  schedule:
    - cron: '17 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  reports:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            native-app/package-lock.json
      - run: npm ci
      - run: npm ci --include=dev
        working-directory: native-app
      - name: Record dependency findings and source evidence
        run: node scripts/report-dependency-audits.mjs
      - name: Preserve reports even when the registry is unavailable
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependency-audit-${{ github.sha }}
          path: dependency-reports/
          if-no-files-found: error
          retention-days: 14
