<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Occulert Session History</title><meta name="description" content="View Occulert session history, fatigue scores, alerts, head nods, and safety reports stored on this device."><meta name="theme-color" content="#0a0e1a"><style>*{box-sizing:border-box}body{margin:0;background:#0a0e1a;color:#e2e8f0;font-family:Inter,Arial,sans-serif}.top{height:68px;background:#111827;border-bottom:1px solid #24324a;display:flex;align-items:center;justify-content:space-between;padding:0 24px}.brand{font-weight:900;color:#fff;letter-spacing:1px}.nav{display:flex;gap:10px}.btn{border:1px solid #344d72;background:#1e2d45;color:#e2e8f0;border-radius:10px;padding:10px 14px;text-decoration:none;font-weight:800;font-size:13px}.btn.primary{background:#2563eb;border-color:#2563eb}.wrap{max-width:1100px;margin:0 auto;padding:28px}h1{margin:0 0 8px;color:#fff}.muted{color:#94a3b8}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:24px 0}.card{background:#111827;border:1px solid #24324a;border-radius:18px;padding:18px}.kpi{font-size:32px;font-weight:900;color:#fff}.label{font-size:12px;color:#94a3b8;text-transform:uppercase;letter-spacing:1.5px}.table{display:grid;gap:12px}.row{display:grid;grid-template-columns:1.2fr .7fr .7fr .7fr .7fr 1fr;gap:12px;align-items:center;background:#0f172a;border:1px solid #24324a;border-radius:14px;padding:14px}.pill{border-radius:999px;padding:6px 10px;font-size:12px;font-weight:900;text-align:center;border:1px solid}.safe{color:#10b981;background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.3)}.watch{color:#f59e0b;background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.3)}.danger{color:#ef4444;background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3)}.empty{border:1px dashed #344d72;border-radius:18px;padding:28px;color:#94a3b8;text-align:center}.clear{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.4);color:#fecaca}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.nav{display:none}.wrap{padding:18px}}</style></head>
<body><div class="top"><div class="brand">Occulert Session History</div><div class="nav"><a class="btn" href="/">Home</a><a class="btn" href="/app.html">Launch App</a><a class="btn" href="/fleet-dashboard.html">Fleet Dashboard</a></div></div><main class="wrap"><h1>Driver session history</h1><p class="muted">This page reads Occulert session data stored locally on this browser/device. A future backend will sync this across devices for fleets.</p><section class="grid"><div class="card"><div class="label">Sessions</div><div class="kpi" id="sessions">0</div></div><div class="card"><div class="label">Avg Safety</div><div class="kpi" id="avgScore">--</div></div><div class="card"><div class="label">Total Alerts</div><div class="kpi" id="alerts">0</div></div><div class="card"><div class="label">Head Nods</div><div class="kpi" id="nods">0</div></div></section><div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap"><button class="btn primary" onclick="render()">Refresh</button><button class="btn clear" onclick="clearHistory()">Clear local history</button></div><section class="table" id="table"></section></main><script>
function cls(s){return s==='ALERT'||s==='HIGH'?'danger':s==='WATCH'?'watch':'safe'}
function getHistory(){try{let h=JSON.parse(localStorage.getItem('occulert-session-history')||'[]');let live=JSON.parse(localStorage.getItem('occulert-live-session')||'null');if(live&&!h.find(x=>x.driverId===live.driverId))h.unshift(live);return h}catch(e){return[]}}
function render(){let h=getHistory();document.getElementById('sessions').textContent=h.length;document.getElementById('alerts').textContent=h.reduce((a,x)=>a+(x.alerts||0),0);document.getElementById('nods').textContent=h.reduce((a,x)=>a+(x.headNods||0),0);document.getElementById('avgScore').textContent=h.length?Math.round(h.reduce((a,x)=>a+(x.safetyScore||0),0)/h.length):'--';let t=document.getElementById('table');if(!h.length){t.innerHTML='<div class="empty">No sessions yet. Open the app, start monitoring, then come back here.</div>';return}t.innerHTML='<div class="row" style="background:transparent;border:0;color:#94a3b8;font-size:12px;text-transform:uppercase;letter-spacing:1px"><div>Driver</div><div>Status</div><div>Safety</div><div>Alerts</div><div>Head Nods</div><div>Last Update</div></div>'+h.map(x=>`<div class="row"><div><strong>${x.name||'Driver'}</strong><br><span class="muted">${x.driverId||'local'}</span></div><div><span class="pill ${cls(x.status)}">${x.status||'SAFE'}</span></div><div><strong>${x.safetyScore??'--'}</strong>/100</div><div>${x.alerts||0}</div><div>${x.headNods||0}</div><div>${x.lastUpdate?new Date(x.lastUpdate).toLocaleString():'--'}</div></div>`).join('')}
function clearHistory(){if(confirm('Clear local Occulert history on this browser?')){localStorage.removeItem('occulert-session-history');localStorage.removeItem('occulert-live-session');render()}}
render();setInterval(render,3000);
</script></body></html>
