name: Prepare dated status snapshot
on:
  push:
    branches: [codex/status-nov24]
    paths: [.github/workflows/prepare-status-snapshot.yml]
permissions:
  contents: read
  pull-requests: read
jobs:
  snapshot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - name: Generate from main and the complete open pull request listing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" > "$RUNNER_TEMP/open.json"
          jq --arg now "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" '{observedAt: $now, complete: true, pullRequests: [ .[][] | {number, headRefName: .head.ref, isDraft: .draft} ]}' "$RUNNER_TEMP/open.json" > docs/status-pull-requests.json
          npm run status -- --write
          node --test scripts/test-status.mjs
          for path in docs/STATUS.md docs/status-pull-requests.json; do
            echo "SNAPSHOT $path $(git hash-object "$path") $(base64 -w0 "$path")"
          done
