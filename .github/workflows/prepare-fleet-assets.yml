name: Prepare fleet asset releases
on:
  push:
    branches: [codex/fleet-plan-messages]
    paths: [.github/workflows/prepare-fleet-assets.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .nvmrc
      - name: Build each fleet report using the full history and the previous report
        shell: bash
        run: |
          set -euo pipefail
          git remote set-branches origin '*'
          git fetch --quiet origin '+refs/heads/*:refs/remotes/origin/*' '+refs/pull/*/head:refs/remotes/pr/*'
          git checkout --quiet --detach e7d4a43d222722eb72df76c1a9076572e63b2f6c
          git config user.name "Occulert release preparation"
          git config user.email "release-prep@users.noreply.github.com"
          npm ci
          while read -r number base feature; do
            git diff "$base" "$feature" -- src/fleet-pilot-report.js > "$RUNNER_TEMP/feature.patch"
            git apply --3way "$RUNNER_TEMP/feature.patch"
            npm run asset:release -- --dry-run
            npm run asset:release
            npm run audit:source-assets
            git add -A
            git -c core.hooksPath=/dev/null commit --quiet -m "Prepare fleet report assets for $number in the isolated checkout"
            NUMBER="$number" python3 - <<'PY'
          import os, json, subprocess, base64
          def git(*args):
              return subprocess.check_output(["git", *args])
          record = {}
          for path in git("diff", "--name-only", "HEAD^", "HEAD").decode().splitlines():
              sha = git("rev-parse", f"HEAD:{path}").decode().strip()
              if path.startswith("fleet-pilot-report.v") and path.endswith(".js"):
                  assert sha == git("rev-parse","HEAD:src/fleet-pilot-report.js").decode().strip()
                  record[path] = {"sha": sha, "source": "src/fleet-pilot-report.js"}
              else:
                  parent = git("rev-parse", f"HEAD^:{path}").decode().strip()
                  patch = git("diff","--unified=3","HEAD^","HEAD","--",path).decode()
                  record[path] = {"sha": sha, "parent": parent, "patch": patch}
          data = base64.b64encode(json.dumps(record, separators=(",",":")).encode()).decode()
          print(f"FLEET_RELEASE {os.environ['NUMBER']} {data}")
          PY
          done <<'CHANGES'
          514 4108714d8d053eb0f0ec6e8a6dff81d90bd89688 267a2a8eb93019da110b0ca8e345cc5bb2cffa52
          523 4108714d8d053eb0f0ec6e8a6dff81d90bd89688 b4b9a5fc1bdd73f050b78c979297d35cf85122fa
          524 b4b9a5fc1bdd73f050b78c979297d35cf85122fa 8ec0b51877827d3b30efe41189615f5d978419b4
          526 8ec0b51877827d3b30efe41189615f5d978419b4 0adc34beb41f14765990b28fe72f863e1603cca5
          527 0adc34beb41f14765990b28fe72f863e1603cca5 0ab1305d7d720e6c1d70161b109988e7499514f8
          CHANGES
