<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Occulert Live GPS Fleet Map</title><meta name="theme-color" content="#0a0e1a"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script><script src="/firebase-config.js"></script><script src="/firebase-sync-v2.js"></script><style>body{margin:0;background:#0a0e1a;color:#e2e8f0;font-family:Inter,Arial,sans-serif}.top{height:64px;background:#111827;border-bottom:1px solid #24324a;display:flex;align-items:center;justify-content:space-between;padding:0 20px}.brand{font-weight:900;color:#fff}.btn{border:1px solid #344d72;background:#1e2d45;color:#e2e8f0;border-radius:10px;padding:10px 14px;text-decoration:none;font-weight:800;font-size:13px}#map{height:calc(100vh - 64px)}.panel{position:absolute;top:84px;right:20px;width:310px;max-height:70vh;overflow:auto;background:#111827;border:1px solid #24324a;border-radius:16px;padding:14px;z-index:500;box-shadow:0 20px 60px rgba(0,0,0,.35)}.driver{border-bottom:1px solid #24324a;padding:10px 0}.driver:last-child{border-bottom:0}.muted{color:#94a3b8;font-size:12px}.pill{display:inline-flex;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900;border:1px solid}.safe{color:#10b981;background:rgba(16,185,129,.1);border-color:rgba(16,185,129,.3)}.watch{color:#f59e0b;background:rgba(245,158,11,.1);border-color:rgba(245,158,11,.3)}.danger{color:#ef4444;background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.3)}@media(max-width:800px){.panel{left:10px;right:10px;width:auto;top:auto;bottom:10px;max-height:36vh}}</style></head><body><div class="top"><div class="brand">Occulert Live GPS Map</div><div><a class="btn" href="/app-ai-v3.html">Launch AI V3</a> <a class="btn" href="/fleet-dashboard.html">Dashboard</a></div></div><div id="map"></div><div class="panel"><strong>Live Drivers</strong><div class="muted" id="status">Connecting to Firebase...</div><div id="drivers"></div></div><script>
const map=L.map('map').setView([37.7749,-122.4194],10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);let markers={};function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function num(v,min,max){let n=Number(v);return Number.isFinite(n)?Math.max(min,Math.min(max,n)):null}function cls(s){return s==='ALERT'||s==='DANGER'||s==='HIGH'?'danger':s==='WATCH'?'watch':'safe'}function color(s){return cls(s)==='danger'?'red':cls(s)==='watch'?'orange':'green'}function localRows(){try{let x=JSON.parse(localStorage.getItem('occulert-live-session')||'null');return x?[x]:[]}catch(e){return[]}}
function render(rows){rows=Array.isArray(rows)?rows:[];document.getElementById('drivers').innerHTML=rows.length?rows.map(d=>{let lat=num(d.lat,-90,90),lng=num(d.lng,-180,180),fatigue=num(d.fatigue,0,100),score=num(d.safetyScore,0,100),alerts=num(d.alerts,0,9999);return `<div class="driver"><strong>${esc(d.name||'Driver')}</strong> <span class="pill ${cls(d.status)}">${esc(d.status||'SAFE')}</span><br><span class="muted">Fatigue ${fatigue??0} · Safety ${score??'--'} · Alerts ${alerts??0}</span><br><span class="muted">${lat!==null&&lng!==null?lat.toFixed(5)+', '+lng.toFixed(5):'No GPS yet'}</span></div>`}).join(''):'<p class="muted">No live drivers yet. Open AI V3 and allow location.</p>';rows.forEach(d=>{let lat=num(d.lat,-90,90),lng=num(d.lng,-180,180);if(lat===null||lng===null)return;let id=String(d.driverId||d.id||d.name||'driver').replace(/[^a-zA-Z0-9_-]/g,'-').slice(0,80),latlng=[lat,lng],fatigue=num(d.fatigue,0,100),score=num(d.safetyScore,0,100),html=`<b>${esc(d.name||'Driver')}</b><br>${esc(d.status||'SAFE')}<br>Fatigue ${fatigue??0}<br>Safety ${score??'--'}`;if(markers[id])markers[id].setLatLng(latlng).setPopupContent(html);else markers[id]=L.circleMarker(latlng,{radius:10,color:color(d.status),fillColor:color(d.status),fillOpacity:.75}).addTo(map).bindPopup(html);});let first=rows.find(d=>num(d.lat,-90,90)!==null&&num(d.lng,-180,180)!==null);if(first)map.setView([num(first.lat,-90,90),num(first.lng,-180,180)],13)}
async function boot(){render(localRows());if(window.OcculertSync){let unsub=await window.OcculertSync.listenLiveSessions(rows=>{document.getElementById('status').textContent='Firebase connected';render(rows)});if(!unsub)document.getElementById('status').textContent='Firebase unavailable. Showing local data.'}else document.getElementById('status').textContent='Sync helper missing.'}boot();setInterval(()=>{if(!Object.keys(markers).length)render(localRows())},3000);
</script></body></html>
