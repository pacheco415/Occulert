name: Dependency Audit Reports

on:
  pull_request:
    paths:
      - 'package*.json'
      - 'native-app/package*.json'
      - 'scripts/report-dependency-audits.mjs'
      - '.github/workflows/dependency-audit.yml'
  push:
    branches: [main]
    paths:
      - 'package*.json'
      - 'native-app/package*.json'
      - 'scripts/report-dependency-audits.mjs'
      - '.github/workflows/dependency-audit.yml'
  schedule:
    - cron: '17 10 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  reports:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            native-app/package-lock.json
      - run: npm ci
      - run: npm ci --include=dev
        working-directory: native-app
      - name: Record dependency findings and source evidence
        run: node scripts/report-dependency-audits.mjs
      - name: Preserve reports even when the registry is unavailable
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dependency-audit-${{ github.sha }}
          path: dependency-reports/
          if-no-files-found: error
          retention-days: 14
