<div class="page" id="page-how">
<div class="container"><div class="section">
<div class="section-label">Simple Setup</div><h2>How It Works</h2>
<p class="section-desc">Occulert works instantly in your browser &#x2014; no download, no app store. Mount your phone, tap Start, and you're protected.</p>
<div class="steps">
<div class="step"><div class="step-num">1</div><h3>Mount Your Phone</h3><p>Place your phone on a dash mount facing you. Any phone holder works &#x2014; the camera just needs to see your eyes.</p></div>
<div class="step"><div class="step-num">2</div><h3>Open &amp; Start</h3><p>Go to occulert.com, tap Launch App, then tap Start Monitoring. The AI model loads in under 3 seconds.</p></div>
<div class="step"><div class="step-num">3</div><h3>Drive Safely</h3><p>Occulert watches your eyes 30 times per second. The moment it detects drowsiness, your phone vibrates, watch buzzes, and earbuds sound an alert.</p></div>
</div>
</div></div>
</div>

<div class="page" id="page-features">
<div class="container"><div class="section">
<div class="section-label">What's Inside</div><h2>Powerful Features</h2>
<p class="section-desc">Built with Google MediaPipe and optimized for real-world driving conditions including night, rain, sunglasses, and highway speeds.</p>
<div class="features-grid">
<div class="feature-card"><div class="feature-icon">&#x1F441;</div><h3>468-Point Eye Tracking</h3><p>Google MediaPipe FaceMesh maps 468 landmarks and calculates your Eye Aspect Ratio 30x per second &#x2014; more precise than dedicated hardware.</p></div>
<div class="feature-card"><div class="feature-icon">&#x26A1;</div><h3>Sub-200ms Alerts</h3><p>Detection to alarm in under 200ms. You'll be alerted before your head starts to droop, giving you time to pull over safely.</p></div>
<div class="feature-card"><div class="feature-icon">&#x1F4F3;</div><h3>Multi-Device Alerts</h3><p>Phone vibration, Apple Watch &amp; Galaxy Watch haptics, and AirPods &amp; Galaxy Buds audio alerts &#x2014; all triggered simultaneously.</p></div>
<div class="feature-card"><div class="feature-icon">&#x1F512;</div><h3>100% On-Device AI</h3><p>All processing happens on your phone. No video, no images, no data ever leaves your device. Your privacy is absolute.</p></div>
<div class="feature-card"><div class="feature-icon">&#x1F319;</div><h3>Night Mode</h3><p>Tuned for low-light driving. Works reliably at night, in tunnels, and with varying road lighting conditions.</p></div>
<div class="feature-card"><div class="feature-icon">&#x1F453;</div><h3>Glasses Support</h3><p>Tested with prescription glasses, reading glasses, and most sunglasses. The AI adapts to your face during calibration.</p></div>
<div class="feature-card"><div class="feature-icon">&#x1F504;</div><h3>Front &amp; Back Camera</h3><p>Switch cameras with one tap. Front camera is recommended for eye tracking &#x2014; mirror mode included.</p></div>
<div class="feature-card"><div class="feature-icon">&#x2699;&#xFE0F;</div><h3>Adjustable Sensitivity</h3><p>Tune detection sensitivity and alert cooldown to match your driving style. Adapts to your personal eye baseline.</p></div>
<div class="feature-card"><div class="feature-icon">&#x1F4CA;</div><h3>Session Event Log</h3><p>Every alert is timestamped and logged in your session history. Review your fatigue patterns after each drive.</p></div>
</div>
</div></div>
</div>

<div class="page" id="page-faq">
<div class="container"><div class="section">
<div class="section-label">Common Questions</div><h2>Frequently Asked Questions</h2>
<div class="faq-list">
<div class="faq-item"><div class="faq-q" onclick="toggleFaq(this)">Does it work with glasses or sunglasses?<span>+</span></div><div class="faq-a">Yes. Occulert is tested with prescription glasses and most sunglasses. During automatic calibration, the AI learns your personal eye baseline. Heavily mirrored lenses may reduce accuracy.</div></div>
<div class="faq-item"><div class="faq-q" onclick="toggleFaq(this)">Does it work at night?<span>+</span></div><div class="faq-a">Yes. Occulert uses your phone's front camera in available light. It works in darkness, tunnels, and varying road lighting. Turning on the interior light briefly during calibration improves accuracy in very dark environments.</div></div>
<div class="faq-item"><div class="faq-q" onclick="toggleFaq(this)">How does it send alerts to my Apple Watch or earbuds?<span>+</span></div><div class="faq-a">Occulert uses the Web Vibration API for haptics. Your Apple Watch or Galaxy Watch receives vibration through the paired phone. AirPods and Bluetooth earbuds receive audio alerts through the phone's audio output.</div></div>
<div class="faq-item"><div class="faq-q" onclick="toggleFaq(this)">Is my video recorded or uploaded anywhere?<span>+</span></div><div class="faq-a">Never. All processing happens 100% on your device. No video, images, or biometric data is ever recorded, stored, or transmitted. Occulert has no servers and no database.</div></div>
<div class="faq-item"><div class="faq-q" onclick="toggleFaq(this)">Does it drain my battery?<span>+</span></div><div class="faq-a">Occulert uses the camera and AI model, which are power-intensive. We recommend plugging into your car charger during long drives. Battery draw is similar to using Google Maps with the screen on.</div></div>
<div class="faq-item"><div class="faq-q" onclick="toggleFaq(this)">How do I install it on my home screen?<span>+</span></div><div class="faq-a">iPhone: Open occulert.com in Safari &#x2192; Share icon &#x2192; "Add to Home Screen". Android: Open in Chrome &#x2192; three-dot menu &#x2192; "Install App". Once installed it works like a native app.</div></div>
<div class="faq-item"><div class="faq-q" onclick="toggleFaq(this)">What is a Passkey and why use it?<span>+</span></div><div class="faq-a">A Passkey is a passwordless login using Face ID or fingerprint. It's more secure than a password and takes under 2 seconds. Your preferences, theme, and settings sync every time you open Occulert.</div></div>
<div class="faq-item"><div class="faq-q" onclick="toggleFaq(this)">Is Occulert really free?<span>+</span></div><div class="faq-a">Yes, 100% free. No subscription, no trial, no credit card. If it helps you stay safe, consider supporting via Cash App ($Richp415) or Venmo (@Rich415).</div></div>
</div>
</div></div>
</div>

<script>
const THEMES={
  cyan:{name:'Cyber Cyan',desc:'Default — deep navy + cyan',primary:'#06b6d4',secondary:'#0891b2',swatch:'linear-gradient(135deg,#06b6d4,#0a0e1a)'},
  blue:{name:'Ocean Blue',desc:'Classic blue — crisp & clear',primary:'#2563eb',secondary:'#1d4ed8',swatch:'linear-gradient(135deg,#2563eb,#0d1117)'},
  green:{name:'Night Vision',desc:'Military green — low light',primary:'#10b981',secondary:'#059669',swatch:'linear-gradient(135deg,#10b981,#0a0f0c)'},
  purple:{name:'Deep Purple',desc:'Bold purple — high contrast',primary:'#8b5cf6',secondary:'#7c3aed',swatch:'linear-gradient(135deg,#8b5cf6,#0d0a1a)'},
  orange:{name:'Sunset',desc:'Warm orange — energizing',primary:'#f59e0b',secondary:'#d97706',swatch:'linear-gradient(135deg,#f59e0b,#0f0d08)'},
  red:{name:'Red Alert',desc:'High urgency — maximum alert',primary:'#ef4444',secondary:'#dc2626',swatch:'linear-gradient(135deg,#ef4444,#0f0808)'},
  white:{name:'Arctic White',desc:'Light mode — bright & clean',primary:'#0ea5e9',secondary:'#0284c7',swatch:'linear-gradient(135deg,#0ea5e9,#e0f2fe)'},
  pink:{name:'Neon Pink',desc:'Vibrant pink — stand out',primary:'#ec4899',secondary:'#db2777',swatch:'linear-gradient(135deg,#ec4899,#0f080d)'}
};
let currentTheme=localStorage.getItem('occulert-theme')||'cyan';
let currentUser=null;
try{currentUser=JSON.parse(localStorage.getItem('occulert-user')||'null');}catch(e){}

function applyTheme(key){
  const t=THEMES[key];if(!t)return;
  currentTheme=key;localStorage.setItem('occulert-theme',key);
  const r=document.documentElement.style;
  r.setProperty('--accent',t.primary);r.setProperty('--accent2',t.secondary);r.setProperty('--cyan',t.primary);
  if(key==='white'){
    r.setProperty('--dark','#f0f4f8');r.setProperty('--dark2','#e2e8f0');r.setProperty('--dark3','#cbd5e1');
    r.setProperty('--card','#fff');r.setProperty('--border','#cbd5e1');r.setProperty('--border2','#94a3b8');
    r.setProperty('--text','#1e293b');r.setProperty('--text2','#475569');r.setProperty('--text3','#64748b');
  } else {
    r.setProperty('--dark','#111827');r.setProperty('--dark2','#1a2235');r.setProperty('--dark3','#1f2d42');
    r.setProperty('--card','#1e2d45');r.setProperty('--border','#2a3f5f');r.setProperty('--border2','#344d72');
    r.setProperty('--text','#e2e8f0');r.setProperty('--text2','#94a3b8');r.setProperty('--text3','#64748b');
  }
  document.querySelectorAll('.color-card').forEach(c=>c.classList.toggle('active',c.dataset.theme===key));
}

function buildColorGrid(){
  const grid=document.getElementById('color-grid');if(!grid)return;
  grid.innerHTML=Object.entries(THEMES).map(([k,t])=>
    `<div class="color-card ${k===currentTheme?'active':''}" data-theme="${k}" onclick="applyTheme('${k}')"><div class="color-swatch" style="background:${t.swatch}"></div><div class="color-name">${t.name}</div><div class="color-desc">${t.desc}</div></div>`
  ).join('');
}

function showPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  const pg=document.getElementById('page-'+id);
  if(pg){pg.classList.add('active');window.scrollTo(0,0);}
}

function updateAuthUI(){
  const authArea=document.getElementById('nav-auth-area');
  const userArea=document.getElementById('nav-user-area');
  const banner=document.getElementById('signed-in-banner');
  if(currentUser&&!currentUser.guest){
    if(authArea)authArea.style.display='none';
    if(userArea)userArea.style.display='flex';
    const n=currentUser.name||'Driver';
    const ini=document.getElementById('nav-avatar-initials');const nm=document.getElementById('nav-user-name');const bn=document.getElementById('banner-user-name');
    if(ini)ini.textContent=n[0].toUpperCase();if(nm)nm.textContent=n;if(bn)bn.textContent=n;
    if(banner)banner.style.display='block';
  } else {
    if(authArea)authArea.style.display='flex';if(userArea)userArea.style.display='none';if(banner)banner.style.display='none';
  }
}

async function signInWithPasskey(){
  const nameInput=document.getElementById('signin-name');
  const name=(nameInput?nameInput.value.trim():'')||'Driver';
  const statusEl=document.getElementById('passkey-status');
  const statusText=document.getElementById('passkey-status-text');
  const formArea=document.getElementById('signin-form-area');
  if(formArea)formArea.style.opacity='0.5';
  if(statusText)statusText.textContent='🔑 Authenticating...';
  await new Promise(r=>setTimeout(r,800));
  currentUser={name:name,signedIn:true,ts:Date.now()};
  localStorage.setItem('occulert-user',JSON.stringify(currentUser));
  updateAuthUI();applyTheme(currentTheme);
  if(statusEl)statusEl.classList.add('show');
  if(statusText)statusText.textContent='✅ Signed in as '+name+'! Launching app...';
  if(formArea)formArea.style.display='none';
  setTimeout(()=>launchApp(),1200);
}

function continueAsGuest(){
  currentUser={name:'Guest',guest:true,ts:Date.now()};
  localStorage.setItem('occulert-user',JSON.stringify(currentUser));
  launchApp();
}

function launchApp(){window.location.href='app.html';}

function submitFleet(){
  const name=document.getElementById('fleet-name').value.trim();
  const email=document.getElementById('fleet-email').value.trim();
  if(!name||!email){alert('Please enter your name and email.');return;}
  const c=document.getElementById('fleet-confirm');if(c)c.style.display='block';
}

function toggleFaq(el){
  const item=el.parentElement;
  const wasOpen=item.classList.contains('open');
  document.querySelectorAll('.faq-item').forEach(i=>i.classList.remove('open'));
  if(!wasOpen)item.classList.add('open');
}

const LANGS=[{code:'en',flag:'🇺🇸',name:'English'},{code:'es',flag:'🇲🇽',name:'Español'},{code:'pt',flag:'🇧🇷',name:'Português'},{code:'fr',flag:'🇫🇷',name:'Français'},{code:'de',flag:'🇩🇪',name:'Deutsch'},{code:'zh',flag:'🇨🇳',name:'中文'}];
let currentLang=localStorage.getItem('occulert-lang')||'en';
function buildLangSwitcher(){
  const menu=document.getElementById('lang-menu');const display=document.getElementById('lang-display');if(!menu)return;
  menu.innerHTML=LANGS.map(l=>`<div class="lang-option ${l.code===currentLang?'active':''}" onclick="setLang('${l.code}','${l.flag}','${l.name}')">${l.flag} ${l.name}</div>`).join('');
  const cur=LANGS.find(l=>l.code===currentLang);if(cur&&display)display.textContent=cur.flag+' '+cur.name;
}
function setLang(code,flag,name){
  currentLang=code;localStorage.setItem('occulert-lang',code);
  const d=document.getElementById('lang-display');if(d)d.textContent=flag+' '+name;
  document.getElementById('lang-menu').classList.remove('open');
  buildLangSwitcher();
}
document.getElementById('lang-display').addEventListener('click',function(e){e.stopPropagation();document.getElementById('lang-menu').classList.toggle('open');});
document.addEventListener('click',function(){document.querySelectorAll('.lang-menu').forEach(m=>m.classList.remove('open'));});

let deferredPrompt;
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferredPrompt=e;document.getElementById('pwa-banner').classList.add('show');});
document.getElementById('pwa-install').addEventListener('click',function(){if(deferredPrompt)deferredPrompt.prompt();document.getElementById('pwa-banner').classList.remove('show');});

(function init(){
  buildColorGrid();buildLangSwitcher();applyTheme(currentTheme);updateAuthUI();
  const p=new URLSearchParams(window.location.search).get('page');if(p)showPage(p);
})();
</script>
</body></html>
