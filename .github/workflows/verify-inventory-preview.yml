name: Verify branch inventory preview
on:
  push:
    branches: [codex/branch-review-nov24]
    paths: [.github/workflows/verify-inventory-preview.yml]
permissions:
  contents: read
  pull-requests: read
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Check the cleanup script in preview mode
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          script=docs/branch-inventory/clean-merged-branches.sh
          dash -n "$script"
          test -x "$script"
          # This checkout has only read permissions. Block any push from the preview.
          real_git="$(command -v git)"
          mkdir -p "$RUNNER_TEMP/git-read"
          cat > "$RUNNER_TEMP/git-read/git" <<'SH'
          #!/bin/sh
          case "$1" in ls-remote) exec "$READONLY_GIT" "$@" ;; *) echo "Unexpected git operation: $1" >&2; exit 9 ;; esac
          SH
          chmod +x "$RUNNER_TEMP/git-read/git"
          READONLY_GIT="$real_git" PATH="$RUNNER_TEMP/git-read:$PATH" sh "$script" > "$RUNNER_TEMP/preview.txt"
          awk 'NF != 2 || length($1) != 40 || $1 !~ /^[0-9a-f]+$/ || $2 == "main" {exit 1}' "$RUNNER_TEMP/preview.txt"
          echo "Live preview count: $(wc -l < "$RUNNER_TEMP/preview.txt")"
