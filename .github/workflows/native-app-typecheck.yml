name: Native App Typecheck

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: native-app/package-lock.json
      - run: npm ci --include=dev
      - run: npm run verify

  eas-install:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native-app
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: native-app/package-lock.json
      - name: Match EAS package manager
        run: npm install --global npm@10.9.8
      - run: npm ci --include=dev
      - run: npm run verify

  watch-notification:
    name: Watch notification freshness
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: node --test scripts/test-watch-notification.mjs
