name: Browser Smoke Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Check native form controls on Linux WebKit
        run: npm run test:browser -- tests/onboarding-form-validation.spec.mjs --project=webkit
      - run: npm run test:browser
      - name: Preserve browser failure and retry diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-test-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Save source and environment verification evidence
        if: ${{ !cancelled() }}
        run: node scripts/write-verification-receipt.mjs browser '${{ job.status }}'
      - name: Preserve verification receipt
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-browser-${{ github.sha }}
          path: .verification-receipts/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
